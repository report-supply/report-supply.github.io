<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Submit a Report - KSA Supplier Watch</title>
<link rel="stylesheet" href="../style.css">
<script>
  (function(){var t=localStorage.getItem('theme')||'light';document.documentElement.setAttribute('data-theme',t);})();
  window.SUPPLIERS_DATA_PATH = '../suppliers-info.txt';
</script>
</head>
<body style="padding-bottom:28px">

<div class="container">
  <header class="header">
    <div class="header-top">
      <div class="brand">
        <div class="brand-mark">📝</div>
        <div class="title-area">
          <h1>Submit a Report</h1>
          <p>Direct, secure submission — no WhatsApp needed</p>
        </div>
      </div>
      <button class="theme-btn" id="themeToggle" onclick="toggleTheme()">
        <span id="themeIcon">🌙</span> <span id="themeText">Dark</span>
      </button>
    </div>
    <nav class="site-nav">
      <a href="../index.html">🏠 All Suppliers</a>
      <a href="../good/index.html">✅ Good <span class="nav-count" id="navGoodCount">0</span></a>
      <a href="../fraud/index.html">🚫 Fraud <span class="nav-count" id="navFraudCount">0</span></a>
      <a href="../submit/index.html" class="active">📝 Submit Report</a>
    </nav>
  </header>

  <main class="form-container">
    <a href="../index.html" class="back-link">← Back to Supplier List</a>

    <div style="margin-bottom:20px">
      <h2 style="font-size:22px;margin-bottom:6px">Report a Supplier</h2>
      <p style="font-size:13px;color:var(--muted)">Use this form to directly report a supplier for payment or salary issues. Submissions are sent securely.</p>
    </div>

    <form action="https://api.web3forms.com/submit" method="POST" class="submit-form">
      <input type="hidden" name="access_key" value="1005f395-35e8-449a-bfdb-fb4f43a3c2ea">

      <div class="form-group">
        <label for="name">Supplier Name</label>
        <input type="text" id="name" name="name" placeholder="e.g., ABC Contracting" required>
      </div>

      <div class="form-group">
        <label for="email">Your Email (For Verification)</label>
        <input type="email" id="email" name="email" placeholder="name@example.com" required>
      </div>

      <div class="form-group">
        <label for="message">Issue Details</label>
        <textarea id="message" name="message" rows="5" placeholder="Describe the payment or salary issues... (e.g., Unpaid for 3 months)" required></textarea>
      </div>

      <button type="submit" class="form-submit-btn">Submit Report</button>
    </form>
  </main>
</div>

<script src="../theme.js"></script>
<script src="../shared.js"></script>
<script>
function updateNavCounts() {
  let good = 0, fraud = 0, unverified = 0;
  SUPPLIERS.forEach(s => {
    const c = classify(s.id);
    if (c === 'good') good++;
    else if (c === 'fraud') fraud++;
    else unverified++;
  });
  document.getElementById('navGoodCount').textContent = good + unverified;
  document.getElementById('navFraudCount').textContent = fraud;
}
initSuppliers().then(updateNavCounts);
</script>
</body>
</html>
